[package]
name = "balance"
description = "Deadroll balance bench: a native egui app over deadroll-sim. cargo run -p balance --release"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deadroll-sim.workspace = true
deadroll-rules = { workspace = true, features = ["serde"] }
deadroll-combat.workspace = true
deadroll-skillcheck = { workspace = true, features = ["std"] }
deadroll-types = { workspace = true, features = ["std"] }
# 0.35 is the newest eframe for the pinned Rust 1.92 (0.36 needs 1.95); egui_plot 0.36 pairs with it.
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_plot = "0.36"
rfd = "0.17"
serde_json = "1"

[dev-dependencies]
# Headless UI test: clicks Run and reads the results.
egui_kittest = { version = "0.35", features = ["eframe"] }
