[workspace]
members = ["programs/*", "programs/*/lib", "crates/*", "crates/combat/wasm", "crates/mapcheck/wasm", "crates/render/wasm", "tools/art", "tools/balance"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
publish = false

[workspace.dependencies]
# Pinned by L0. Changing a pin is a lead-lane PR (see agents/TASKS.md, dependency decision).
anchor-lang = "=1.2.1"
borsh = { version = "1.5.7", default-features = false, features = ["derive"] }
# Same major as anchor-lang 1.2.1 (default `solana-v3` cohort), so `Pubkey` is one type everywhere.
solana-pubkey = { version = "3", default-features = false, features = ["borsh"] }
sha2 = { version = "0.10", default-features = false }
# External program crates, pinned by the L0.4 spike decision (agents/TASKS.md). Use `.workspace = true`.
ephemeral-vrf-sdk = { version = "=0.17.3", features = ["anchor"] }
# A program using it forwards `idl-build = [..., "session-keys/idl-build"]`.
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
# Default features only: its `anchor` feature targets Anchor 0.31/0.32.
mpl-core = "=0.12.1"

deadroll-types = { path = "crates/types" }
deadroll-combat = { path = "crates/combat" }
deadroll-skillcheck = { path = "crates/skillcheck" }
deadroll-mapcheck = { path = "crates/mapcheck" }
deadroll-render = { path = "crates/render" }
deadroll-rules = { path = "crates/rules" }
deadroll-sim = { path = "crates/sim" }

# Programs as dependencies come from their `lib/` package (same source, rlib only), never from the
# program package itself. A program is `crate-type = ["cdylib", "lib"]`, and cargo leaves the hash out
# of a cdylib's file names, so the program build and its `cpi` build (another program's dependency)
# would write the same target/sbpfv3-solana-solana/release/deps/libdeadroll_<p>.rlib and each one
# would take the other's file for its own (E0463, E0308, a no-entrypoint .so in target/deploy).
# To depend on another program, add a `programs/<p>/lib/Cargo.toml` like these.
deadroll-registry = { path = "programs/registry/lib", package = "deadroll-registry-lib", features = ["cpi"] }
deadroll-character = { path = "programs/character/lib", package = "deadroll-character-lib", features = ["cpi"] }
deadroll-map = { path = "programs/map/lib", package = "deadroll-map-lib", features = ["cpi"] }
deadroll-session = { path = "programs/session/lib", package = "deadroll-session-lib", features = ["cpi"] }
deadroll-city = { path = "programs/city/lib", package = "deadroll-city-lib", features = ["cpi"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

# WASM builds for the website (`crates/combat/wasm`, rasterizer). Programs keep `release`.
# cargo build -p <crate> --target wasm32-unknown-unknown --profile wasm
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
