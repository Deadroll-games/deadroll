name: Bug
description: Something does not work as described in the docs.
title: "[bug] "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Found a security vulnerability? Do NOT open a public issue. Use "Report a vulnerability" in the Security tab instead.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - registry
        - character
        - items
        - map
        - session
        - city
        - render
        - crates
        - app
        - sdk
        - worker
        - tools
        - docs
        - art
        - not sure
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a character...
        2. Enter a party...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: Link the doc section if the expected behaviour is described there.
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - localnet
        - devnet
        - mainnet
        - website only
    validations:
      required: true

  - type: input
    id: tx
    attributes:
      label: Transaction signature
      description: If a transaction failed or behaved wrong.
      placeholder: "5h3k...xyz"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Program logs, browser console, test output.
      render: shell
    validations:
      required: false
