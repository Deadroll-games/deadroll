[package]
name = "deadroll-combat-wasm"
description = "C ABI over deadroll-combat for the website: replay hits from a VRF seed, preview attacks and a hero's derived stats (inputs built by deadroll-rules)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
deadroll-combat = { workspace = true, features = ["borsh"] }
# Builds the hit inputs from a hero, a skill and a monster exactly as the session program does.
deadroll-rules.workspace = true
deadroll-skillcheck.workspace = true
deadroll-types.workspace = true
borsh.workspace = true

[dev-dependencies]
serde_json = "1"
# Tests and fixtures use the shipped registry (assets/registry), the data the session copies.
deadroll-rules = { workspace = true, features = ["serde"] }
