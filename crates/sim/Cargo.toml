[package]
name = "deadroll-sim"
description = "Deadroll balance simulator: whole fights on deadroll-rules and crates/combat with seeded dice, presets as JSON, rayon batches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deadroll-types = { workspace = true, features = ["std"] }
deadroll-combat.workspace = true
deadroll-skillcheck = { workspace = true, features = ["std"] }
deadroll-rules = { workspace = true, features = ["serde"] }
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Parity test only: the program's own code on the same dice. Anchor is never a normal dependency.
deadroll-session.workspace = true
deadroll-character.workspace = true
deadroll-items.workspace = true
