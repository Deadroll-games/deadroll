[package]
name = "deadroll-skillcheck"
description = "Deadroll skill checks (docs/SKILL_BUILDER.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
std = ["borsh/std", "deadroll-types/std"]
# Derive Anchor traits on `SkillBlocks` and the enums, so the character program can take them
# as instruction args and store them in accounts (same pattern as `crates/types`).
anchor = ["dep:anchor-lang", "std", "deadroll-types/anchor"]
# Put the types into program IDLs (and so into the Codama sdk).
idl-build = ["anchor", "anchor-lang/idl-build", "deadroll-types/idl-build"]

[dependencies]
deadroll-types.workspace = true
borsh.workspace = true
anchor-lang = { workspace = true, optional = true }

[dev-dependencies]
borsh = { workspace = true, features = ["std"] }
