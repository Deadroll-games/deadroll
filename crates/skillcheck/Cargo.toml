[package]
name = "deadroll-skillcheck"
description = "Deadroll skill checks (docs/SKILL_BUILDER.md)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
std = ["deadroll-types/std"]

# No Anchor here (docs/ARCHITECTURE.md, section 5): `SkillBlocks` and the block enums live in
# `deadroll_types::skill`, and the programs turn on `deadroll-types/anchor` for them.
[dependencies]
deadroll-types.workspace = true

[dev-dependencies]
borsh = { workspace = true, features = ["std"] }
