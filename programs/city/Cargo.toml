[package]
name = "deadroll-city"
description = "Deadroll city: city, buildings, Tavern board and quests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
name = "deadroll_city"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "deadroll-types/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
deadroll-types = { workspace = true, features = ["anchor"] }
# `GameConfig` PDA address and owner: its authority and the program allowlist.
deadroll-registry.workspace = true
# `Map` (read by `post_quest`, no CPI).
deadroll-map.workspace = true

[dev-dependencies]
solana-sha256-hasher = "3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
