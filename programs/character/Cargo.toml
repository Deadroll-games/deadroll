[package]
name = "deadroll-character"
description = "Deadroll character: player profiles, characters, gear, skills, bag."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
name = "deadroll_character"

[features]
# `nft` is the target design (Core NFT per character). Building with `--no-default-features`
# is the FALLBACK(nft) seam: PDA only, `nft = None`.
default = ["nft"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "deadroll-types/idl-build",
    "session-keys/idl-build",
]
anchor-debug = []
custom-heap = []
custom-panic = []
nft = ["dep:mpl-core"]

[dependencies]
anchor-lang.workspace = true
deadroll-types = { workspace = true, features = ["anchor"] }
deadroll-skillcheck.workspace = true
# Creation and HP numbers, shared with the session program and tools/balance.
deadroll-rules.workspace = true
mpl-core = { workspace = true, optional = true }
# `SessionTokenV2` layout for the session key check on `equip` / `unequip` (`auth.rs`).
session-keys.workspace = true
# `SkillExtras` is zero-copy (over 3 KB, never on the SBF stack).
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
