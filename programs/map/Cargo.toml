[package]
name = "deadroll-map"
description = "Deadroll map: maps, layouts, validation and finalization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
name = "deadroll_map"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "deadroll-types/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
deadroll-types = { workspace = true, features = ["anchor"] }
deadroll-mapcheck.workspace = true
# Patch 6: bestiary templates (`MonsterTemplate`, the slot numbers of `BalanceConfig`) and the
# monster skill record, to build each spawn's `SpawnRules` from the registry.
deadroll-rules.workspace = true
deadroll-skillcheck.workspace = true
# `GameConfig` PDA address and owner; the table view (`state::view`).
deadroll-registry.workspace = true
# `layout_hash` in `finalize_map`: the SHA-256 syscall (~141k CU less than the pure-Rust sha2).
# Already in Cargo.lock at 3.1.0 through anchor-lang.
solana-sha256-hasher = "3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
