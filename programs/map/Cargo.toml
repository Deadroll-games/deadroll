[package]
name = "deadroll-map"
description = "Deadroll map: maps, layouts, validation and finalization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "deadroll_map"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "deadroll-types/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
deadroll-types = { workspace = true, features = ["anchor"] }
deadroll-mapcheck.workspace = true
# `GameConfig` PDA address and owner only.
deadroll-registry.workspace = true
# `layout_hash` in `finalize_map` (Anchor 1.2 no longer re-exports `solana_program::hash`).
sha2.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
