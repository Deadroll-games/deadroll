# The map program as a library for other crates (`[workspace.dependencies] deadroll-map`).
# Same source as the program (../src), rlib only: a cdylib output has no hash in its file name, so
# the program build and its `cpi` build would share one file in target/ (root Cargo.toml).
# Keep [features] and [dependencies] in sync with ../Cargo.toml.
[package]
name = "deadroll-map-lib"
description = "Deadroll map as an rlib for other crates (CPI, account layouts)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "deadroll_map"
path = "../src/lib.rs"
crate-type = ["rlib"]
test = false
doctest = false

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "deadroll-types/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
deadroll-types = { workspace = true, features = ["anchor"] }
deadroll-mapcheck.workspace = true
deadroll-rules.workspace = true
deadroll-skillcheck.workspace = true
deadroll-registry.workspace = true
solana-sha256-hasher = "3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
