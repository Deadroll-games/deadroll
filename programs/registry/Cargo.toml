[package]
name = "deadroll-registry"
description = "Deadroll registry: GameConfig, aspect and resonance tables, bestiary, tileset, prefabs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
doctest = false
name = "deadroll_registry"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "deadroll-types/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang.workspace = true
deadroll-types = { workspace = true, features = ["anchor"] }
# The resonance table formats (`deadroll_combat::tables`): the registry validates with the
# decoder every reader uses. Pure, no Anchor.
deadroll-combat.workspace = true
# The monster skill record and the monster builder rules (`deadroll_skillcheck::monster`).
deadroll-skillcheck.workspace = true
# Patch 11: the reward table record (`deadroll_rules::loot`), the decoder every reader uses.
deadroll-rules.workspace = true
# Required by `#[account(zero_copy)]` (the table accounts).
bytemuck = { version = "1", features = ["derive"] }

[dev-dependencies]
# Discriminator checks in tests; already in Cargo.lock through anchor-lang.
solana-sha256-hasher = "3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
